<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="GBL Note 볼 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef2"/>
      <stop offset="0.5" stop-color="#6d3fe6"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="128" cy="128" r="112"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b1e8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <circle cx="128" cy="128" r="112" fill="url(#bg)"/>
  </g>
  <circle cx="128" cy="128" r="112" fill="url(#hl)"/>
  <!-- 적도 밴드 -->
  <g clip-path="url(#ball)">
    <rect x="0" y="116" width="256" height="24" fill="#ffffff" opacity="0.9"/>
    <rect x="0" y="116" width="256" height="6" fill="#0f172a" opacity="0.08"/>
  </g>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- 중앙 버튼 -->
  <circle cx="128" cy="128" r="42" fill="#ffffff"/>
  <circle cx="128" cy="128" r="31" fill="url(#bg)"/>
  <!-- 에너지 볼트 -->
  <path d="M 137 104 L 116 132 L 128 132 L 121 152 L 143 122 L 130 122 Z" fill="#ffffff"/>
</svg>
