  <text x="132" y="90" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="-1" fill="#0f172a">GBL</text>
  <text x="278" y="90" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="-1" fill="url(#grad)">NOTE</text>
  <text x="134" y="120" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="19" letter-spacing="0.5" fill="#64748b">포켓몬GO 올인원 · 한국어판</text>
